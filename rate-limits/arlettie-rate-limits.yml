generated: '2026-08-17'
method: probed
source: >-
  https://lesechappees.arlettie.com/llms.txt (documented) plus response headers observed on
  /api/ucp/mcp, /api/2026-04/graphql.json and /products.json
note: >-
  Arlettie publishes a rate-limit RULE but no rate-limit NUMBER. llms.txt and robots.txt tell an agent
  the MCP endpoint is rate-limited per IP and to back off on 429, and every response carries a
  cost-accounting header — but no ceiling, window, remaining count or reset time is published anywhere.
  An agent can therefore see what a call cost but cannot compute how many it has left.


problems:
- id: ucp-invalid-profile-url
  surface: mcp
  transport_status: 200
  code: -32001
  message: UCP discovery failed
  data_code: invalid_profile_url
  data_content: 'Unable to fetch agent profile: Missing profile uri'
  continue_url: https://arlettie-les-echapees.myshopify.com/
  induced_by: 'POST /api/ucp/mcp {"method":"no_such_method"}'
  also_induced_by: 'POST /api/ucp/mcp tools/call get_cart with cart_id "bogus"'
  remediation: >-
    Supply the UCP agent profile URI. Every tool inputSchema on this endpoint declares a required
    "meta" object carrying meta["ucp-agent"].profile — a URI identifying the calling agent. The
    endpoint resolves that profile BEFORE it routes the method, which is why an unknown method and a
    bad tool argument both surface as the same discovery failure rather than as -32601 Method not found
    or a validation error.
  significance: >-
    This is the single most important operational fact about Arlettie's agent surface. tools/list is
    fully anonymous and needs no profile, so discovery looks open; the first tools/call without a
    profile URI fails with a message that names neither the missing field nor the tool. An integrator
    reading only "UCP discovery failed" has no path to the fix.

- id: graphql-undefined-field
  surface: graphql
  transport_status: 200
  extensions_code: undefinedField
  message: Field 'nope' doesn't exist on type 'QueryRoot'
  induced_by: 'POST /api/2026-04/graphql.json {"query":"{nope}"}'
  fields_returned: [message, locations, path, extensions.code, extensions.typeName, extensions.fieldName]
  remediation: >-
    Introspect the schema. It answers unauthenticated at this endpoint, so field names are verifiable
    ahead of the call.
  quality: >-
    Well formed — names the offending field, its parent type, the source location and a stable
    machine-readable code.


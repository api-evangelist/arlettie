- aid: arlettie-les-echappees-storefront
  name: Arlettie Les échappées Storefront Data API
  description: 'The Shopify Storefront GraphQL API and public JSON endpoints on the Les échappées
    storefront. Introspection answers unauthenticated at /api/2026-04/graphql.json (424 types;
    shop.name returns "Arlettie Les échappées"), and the store also serves unauthenticated
    /products.json, /collections.json, /products/{handle}.json and
    /collections/{handle}/products.json product feeds plus a sitemap index. Dated API versions
    2025-01, 2026-01, 2026-04 and unstable all respond.'
  humanURL: https://lesechappees.arlettie.com/
  baseURL: https://lesechappees.arlettie.com/api/2026-04/graphql.json

apis:
- aid: arlettie-les-echappees-ucp-mcp
  name: Arlettie Les échappées UCP/MCP Agent Commerce
  description: 'Live, unauthenticated Model Context Protocol endpoint on the Les échappées storefront
    implementing the Universal Commerce Protocol (UCP) 2026-04-08. tools/list returns 13 tools with
    full JSON Schema inputSchemas covering catalog search/lookup, product detail, cart lifecycle,
    checkout lifecycle and order retrieval. Payment completion requires contemporaneous human
    approval per the store''s own published agent rules. This is a Shopify platform capability
    deployed for Arlettie''s store, served from a host Arlettie controls.'
  humanURL: https://lesechappees.arlettie.com/agents.md
  baseURL: https://lesechappees.arlettie.com/api/ucp/mcp

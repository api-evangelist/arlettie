aid: arlettie
name: Arlettie
description: 'Arlettie is a Paris-founded (1994) operator of invitation-only luxury and contemporary
  fashion private sales — "ventes privées" / sample sales — running showroom events in Paris, London,
  Milan and New York for more than 220 brand partners, alongside its online outlet store "Les échappées".
  Its machine-readable surface is not a developer program: it is an agent-commerce surface on the
  Les échappées storefront, which runs on Shopify and therefore serves a live unauthenticated
  UCP/MCP endpoint, agent instructions at /agents.md and /llms.txt, RFC 8414 + RFC 9728 OAuth
  discovery documents, and an introspectable Storefront GraphQL API — all on hosts Arlettie controls.'

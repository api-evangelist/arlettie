note: >-
  Every "conforms: true" below is backed by a document or response header observed on a host Arlettie
  controls. None of it is a compliance claim Arlettie publishes about itself — the company publishes
  no trust centre, no certifications and no security policy (see security/), so no Compliance pointer
  is emitted. The standards satisfied here are satisfied because the storefront runs on Shopify.

standards:
- id: mcp
  name: Model Context Protocol
  conforms: true
  evidence: >-
    POST tools/list to https://lesechappees.arlettie.com/api/ucp/mcp returned a JSON-RPC 2.0 result
    with 13 tools, each carrying a draft 2020-12 inputSchema. HTTP 200.
- id: ucp
  name: Universal Commerce Protocol
  version: '2026-04-08'
  conforms: true
  evidence: >-
    /.well-known/ucp returns a merchant profile declaring supported_versions 2026-04-08 and
    2026-01-23, the dev.ucp.shopping service over the mcp transport, eight capabilities
    (checkout, fulfillment, discount, cart, order, catalog.search, catalog.lookup, dev.shopify.catalog)
    and two payment handlers.
- id: jsonrpc-2.0
  name: JSON-RPC 2.0
  conforms: true
  evidence: >-
    Both MCP endpoints answer with {"jsonrpc":"2.0","id":...} envelopes and return
    {"error":{"code":-32001,...}} on an unroutable call.
- id: json-schema-2020-12
  name: JSON Schema draft 2020-12
  conforms: true
  evidence: >-
    Every tool inputSchema declares
    "$schema":"https://json-schema.org/draft/2020-12/schema".
- id: oauth2
  name: OAuth 2.0
  conforms: true
  evidence: >-
    authorization_endpoint, token_endpoint and grant_types_supported
    [authorization_code, refresh_token, urn:ietf:params:oauth:grant-type:jwt-bearer] published at
    /.well-known/oauth-authorization-server.
- id: rfc8414
  name: 'RFC 8414: OAuth 2.0 Authorization Server Metadata'
  conforms: true
  evidence: /.well-known/oauth-authorization-server returns 200 application/json with issuer + endpoints.
- id: rfc9728
  name: 'RFC 9728: OAuth 2.0 Protected Resource Metadata'
  conforms: true
  evidence: >-
    /.well-known/oauth-protected-resource returns resource https://lesechappees.arlettie.com,
    authorization_servers and bearer_methods_supported [header].
- id: oidc
  name: OpenID Connect Core
  conforms: true
  evidence: >-
    openid + email in scopes_supported, id_token_signing_alg_values_supported [RS256], a claims_supported
    set, jwks_uri and end_session_endpoint.
- id: rfc7636
  name: 'RFC 7636: PKCE'
  conforms: true
  evidence: code_challenge_methods_supported [S256].
- id: rfc8594
  name: 'RFC 8594: Sunset HTTP Header'
  conforms: true
  evidence: >-
    Responses from /api/mcp carry "Sunset: Mon, 31 Aug 2026 00:00:00 GMT", "Deprecation: @1782259200"

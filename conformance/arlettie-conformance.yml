    HTML shell, which is not a card.

certifications_published_by_arlettie: []
compliance_note: >-
  Arlettie asserts no certifications on its own surface. The storefront's OAuth op_policy_uri and
  op_tos_uri point at shopify.com/legal — Shopify's policies, not Arlettie's. GDPR is presumed
  applicable to a French operator but is not claimed in any machine-readable form, so it is not
  recorded as conformance.


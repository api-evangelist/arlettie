method: searched
source: https://lesechappees.arlettie.com/agents.md
status: published
ownership_note: >-
  The MCP endpoints below are Shopify platform capability, not software Arlettie wrote. They are
  recorded as Arlettie's agent surface because they are served from hosts Arlettie controls
  (custom domain lesechappees.arlettie.com; canonical store arlettie-les-echapees.myshopify.com),
  they are advertised by Arlettie's own /robots.txt, /llms.txt and /agents.md, and they return
  Arlettie's catalog, cart, checkout and policy data. GraphQL shop.name confirms the merchant as
  "Arlettie Les échappées" and merchant_origin in the UCP profile is lesechappees.arlettie.com.
  Corporate www.arlettie.com serves no MCP endpoint and no developer program.

deployment:
  mode: remote
  endpoint: https://lesechappees.arlettie.com/api/ucp/mcp
  auth: none
  verified: probed

servers:
- name: ucp-mcp
  role: current
  url: https://lesechappees.arlettie.com/api/ucp/mcp
  transport: http
  auth: none
  protocol: UCP 2026-04-08 over MCP
  tools_list_status: 200
  tools_count: 13
  raw: mcp/arlettie-ucp-mcp-tools.json
  discovery: https://lesechappees.arlettie.com/.well-known/ucp
  note: >-
    Successor endpoint. Advertised in /.well-known/ucp as the dev.ucp.shopping service with
    transport "mcp". The discovery document names the endpoint on the canonical myshopify.com host
    (https://arlettie-les-echapees.myshopify.com/api/ucp/mcp); the custom-domain form answers
    identically. tools/call requires a UCP agent profile URI in _meta (see errors/).
- name: storefront-mcp
  role: deprecated
  url: https://lesechappees.arlettie.com/api/mcp

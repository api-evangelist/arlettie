# 13 tools, verbatim names + first description line from the live tools/list on /api/ucp/mcp.
# Full JSON Schema inputSchemas are in mcp/arlettie-ucp-mcp-tools.json.
tools:
- name: search_catalog
  category: catalog
  description: Search for products from the online store, hosted on Shopify.
  required: [meta, catalog]
  capability: dev.ucp.shopping.catalog.search
- name: lookup_catalog
  category: catalog
  description: Look up multiple products or variants by identifier.
  required: [meta, catalog]
  capability: dev.ucp.shopping.catalog.lookup
- name: get_product
  category: catalog
  description: Retrieve complete product detail by identifier. Returns a singular product.
  required: [meta, catalog]
  capability: dev.ucp.shopping.catalog.lookup
- name: create_cart
  category: cart
  description: Creates a new cart.
  required: [meta, cart]
  capability: dev.ucp.shopping.cart
- name: get_cart
  category: cart
  description: Get the cart contents.
  required: [meta, id]
  capability: dev.ucp.shopping.cart
- name: update_cart
  category: cart
  description: Perform updates to a cart.
  required: [meta, cart, id]
  capability: dev.ucp.shopping.cart
- name: cancel_cart
  category: cart
  description: Cancels a cart.
  required: [meta, id]
  capability: dev.ucp.shopping.cart
- name: create_checkout
  category: checkout
  description: Creates a checkout. Returns checkout details, including line items, totals, and any
    applicable discounts or taxes.
  required: [meta, checkout]
  capability: dev.ucp.shopping.checkout
- name: get_checkout
  category: checkout
  description: Returns details about the checkout, including line items, totals, and any applicable
    discounts or taxes.
  required: [meta, id]
  capability: dev.ucp.shopping.checkout
- name: update_checkout
  category: checkout
  description: Updates a checkout. Returns checkout details, including line items, totals, and any
    applicable discounts or taxes.
  required: [meta, checkout, id]
  capability: dev.ucp.shopping.checkout
- name: complete_checkout
  category: checkout
  description: Completes a checkout and returns the checkout result.
  required: [meta, id, checkout]
  capability: dev.ucp.shopping.checkout
  human_approval_required: true
  note: >-
    Arlettie's own published agent rules (robots.txt and agents.md) forbid completing payment
    without explicit, contemporaneous buyer approval.
- name: cancel_checkout
  category: checkout
  description: Cancels a checkout.
  required: [meta, id]
  capability: dev.ucp.shopping.checkout
- name: get_order
  category: order
  description: Get the details of an order.
  required: [meta, id]
  capability: dev.ucp.shopping.order

